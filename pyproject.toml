[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-aware-covert-speech"
version = "1.0.0"
description = "Multimodal EEG, EMG and audio implementation for semantic-aware covert speech decoding"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Hossein Ahmadi"}]
dependencies = [
  "numpy>=1.26.4,<2",
  "scipy>=1.14.1,<1.15",
  "torch>=2.5.1,<2.6",
  "scikit-learn>=1.5.2,<1.6",
  "pandas>=2.2.3,<2.3",
  "matplotlib>=3.9.2,<3.10",
  "PyYAML>=6.0.2,<7",
  "mne>=1.8.0,<1.9",
  "librosa>=0.10.2.post1,<0.11",
  "sentence-transformers>=3.3.1,<3.4",
  "transformers>=4.57.6,<4.58",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.10", "build>=1.2,<2"]

[project.scripts]
semantic-speech = "semantic_speech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
